# Infrastructure locale de Kelvyn Tube.
# Ports décalés (5433, 6380…) pour ne pas entrer en conflit avec des services déjà installés.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kelvyn
      POSTGRES_PASSWORD: kelvyn
      POSTGRES_DB: kelvyntube
    ports:
      - "5433:5432"
    volumes:
      - kt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelvyn -d kelvyntube"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kt_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - kt_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: kt_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kelvyntube
      MINIO_ROOT_PASSWORD: kelvyntube-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kt_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Crée le bucket public au démarrage
  minio-init:
    image: minio/mc:latest
    container_name: kt_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 kelvyntube kelvyntube-secret;
      mc mb --ignore-existing local/kelvyntube;
      mc anonymous set download local/kelvyntube;
      echo 'Bucket kelvyntube prêt';
      "

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: kt_meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: kelvyntube-meili-master-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - kt_meilidata:/meili_data

  # Boîte mail de développement — UI sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: kt_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  kt_pgdata:
  kt_redisdata:
  kt_miniodata:
  kt_meilidata:
